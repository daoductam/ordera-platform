version: '3.8'

services:
  # 1. Reverse Proxy & API Gateway (Nginx)
  gateway:
    image: nginx:1.27-alpine
    container_name: ordera-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # 2. Frontend Web Application (React 19 + TypeScript + Vite)
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: ordera-frontend
    expose:
      - "80"
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # 3. Backend REST API (Spring Boot 3.3.5 + Java 21)
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: ordera-backend
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=ordera_db
      - DB_USER=ordera_user
      - DB_PASS=ordera_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MAIL_HOST=mailhog
      - MAIL_PORT=1025
      - SPRING_PROFILES_ACTIVE=dev
      - FLYWAY_ENABLED=true
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  # 4. PostgreSQL 16 Primary Database (RLS & Partitioning)
  postgres:
    image: postgres:16-alpine
    container_name: ordera-postgres
    environment:
      - POSTGRES_DB=ordera_db
      - POSTGRES_USER=ordera_user
      - POSTGRES_PASSWORD=ordera_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/init-database.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordera_user -d ordera_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 5. Redis 7 Cache & Distributed Lock
  redis:
    image: redis:7-alpine
    container_name: ordera-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # 6. MailHog - Mock SMTP Server cho OTP Email
  mailhog:
    image: mailhog/mailhog:latest
    container_name: ordera-mailhog
    ports:
      - "8025:8025" # Web Dashboard xem thư OTP
      - "1025:1025" # SMTP server port
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
